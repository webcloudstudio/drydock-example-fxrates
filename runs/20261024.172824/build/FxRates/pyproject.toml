[project]
name = "fxrates"
version = "0.1.0"
description = "ECB reference rate loader and query service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
]

[project.scripts]
fxrates = "cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
